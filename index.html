
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Wayfinder - マップ</title>

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#">
      <span class="brand-icon">✦</span>
      <span>Wayfinder</span>
    </a>
    <span class="top-note">あなたのための地図</span>
  </header>

  <main class="app-layout">
    <aside class="sidebar">
      <section class="intro">
        <p class="eyebrow">EXPLORE THE WORLD</p>
        <h1>どこへ行こう？</h1>
        <p class="muted">場所を検索して、ルートを見つけよう。</p>
      </section>

      <section class="panel">
        <h2>場所を検索</h2>
        <form id="searchForm" class="search-form">
          <input id="searchInput" type="search"
            placeholder="住所・駅名・建物名..."
            autocomplete="off" required>
          <button class="primary-btn" type="submit">検索</button>
        </form>
        <p id="searchStatus" class="status" aria-live="polite"></p>
        <div id="searchResults" class="results"></div>
      </section>

      <section class="panel">
        <div class="section-heading">
          <h2>ルート案内</h2>
          <span class="mini-icon">↗</span>
        </div>

        <label for="startInput">出発地</label>
        <input id="startInput" placeholder="出発地を選択">

        <div class="route-connector">
          <span></span>
        </div>

        <label for="endInput">目的地</label>
        <input id="endInput" placeholder="目的地を選択">

        <div class="route-actions">
          <button id="useCurrentBtn" class="secondary-btn" type="button">
            現在地を出発地に
          </button>
          <button id="routeBtn" class="primary-btn full-btn" type="button">
            ルートを検索
          </button>
          <button id="clearRouteBtn" class="text-btn" type="button">
            ルートをクリア
          </button>
        </div>

        <div id="routeInfo" class="route-info" aria-live="polite">
          <span class="route-info-icon">↗</span>
          <div>
            <strong id="routeDistance">ルート未設定</strong>
            <p id="routeDuration">出発地と目的地を選択してください</p>
          </div>
        </div>
        <p id="routeStatus" class="status" aria-live="polite"></p>
      </section>

      <section class="panel">
        <div class="section-heading">
          <h2>保存した場所</h2>
          <span id="savedCount" class="count">0</span>
        </div>
        <p class="muted small">
          地図をクリックすると場所を登録できます。
        </p>
        <div id="savedPlaces" class="saved-list"></div>
        <button id="clearSavedBtn" class="text-btn danger" type="button">
          保存した場所をすべて削除
        </button>
      </section>

      <p class="sidebar-footer">
        Map data © OpenStreetMap contributors
      </p>
    </aside>

    <section class="map-section">
      <div class="map-toolbar">
        <div class="map-title">
          <span class="online-dot"></span>
          <div>
            <strong>マップ</strong>
            <p id="mapSubtitle">地図を移動して探索できます</p>
          </div>
        </div>
        <button id="locateBtn" class="location-btn" type="button">
          <span>◎</span> 現在地
        </button>
      </div>

      <div id="map" aria-label="操作できる地図"></div>

      <div class="map-legend">
        <span><i class="legend-dot blue"></i>出発地</span>
        <span><i class="legend-dot red"></i>目的地</span>
        <span><i class="legend-line"></i>ルート</span>
      </div>
      <div id="mapMessage" class="map-message" aria-live="polite"></div>
    </section>
  </main>

  <footer class="page-footer">
    Wayfinder · 地図データ © OpenStreetMap contributors
  </footer>
</body>
</html>
